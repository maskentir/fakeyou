<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1000" width="1200" height="1000" role="img" aria-labelledby="t d"><title id="t">Fakeyou architecture</title><desc id="d">Fakeyou architecture. An operator calls the token-authenticated api over HTTPS and follows its event stream. Inside your infrastructure the api hands jobs and live session commands to four worker roles over Redis streams. worker-sessions runs the browser, audio, turn judge and voice and joins Google Meet as a named guest; worker-ingestion turns the meeting record into memory graph episodes; worker-debrief writes debriefs and decision claims; worker-reembed refreshes memory graph embeddings. The api and workers share PostgreSQL, Neo4j with Graphiti, the meeting record files, RustFS object storage and a local embeddings service. The workers call the speech-to-text, voice, reply and memory model providers you configure.</desc><style>
.in,.pop,.slide,.wob{transform-box:fill-box;transform-origin:center}
.in{animation:in .75s cubic-bezier(.2,1.45,.35,1) both}
@keyframes in{from{transform:translateY(-36px) rotate(-7deg)}}
.pop{animation:pop .6s cubic-bezier(.2,1.6,.4,1) both}
@keyframes pop{from{transform:scale(.82) rotate(-5deg)}}
.slide{animation:slide .7s cubic-bezier(.2,1.2,.4,1) both}
@keyframes slide{from{transform:translateX(-36px)}}
.wob{animation:wob 3.4s ease-in-out infinite alternate}
@keyframes wob{from{transform:rotate(-3deg)}to{transform:rotate(3deg)}}
.pulse{transform-box:fill-box;transform-origin:50% 100%;animation:pulse 1.3s ease-in-out infinite alternate}
@keyframes pulse{from{transform:scaleY(.45)}}
.marquee{animation:marquee 46s linear infinite}
@keyframes marquee{to{transform:translateX(var(--shift))}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><defs><pattern id="ink-dots" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(28)"><circle cx="4.5" cy="4.5" r="1.6" fill="#FFFBF2"/></pattern><pattern id="red-dots" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(18)"><circle cx="7" cy="7" r="2.4" fill="#111111" fill-opacity=".16"/></pattern><pattern id="cream-dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="4" cy="4" r="1.8" fill="#111111" fill-opacity=".08"/></pattern><marker id="head-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#111111"/></marker><marker id="head-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#FFFBF2"/></marker><marker id="head-lime" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D7F043"/></marker><clipPath id="frame"><rect width="1200" height="1000" rx="26"/></clipPath></defs><g clip-path="url(#frame)"><rect x="0" y="0" width="1200" height="1000" fill="#F6EEDF"/><rect x="0" y="0" width="1200" height="1000" fill="url(#cream-dots)"/><g class="slide" style="animation-delay:0.00s"><rect x="56" y="44" width="86" height="62" fill="#111111" rx="4"/><text x="99" y="89" font-family="'Arial Black','Arial Bold',Gadget,Impact,'Helvetica Neue',Arial,sans-serif" font-size="38" font-weight="900" fill="#F6EEDF" text-anchor="middle">04</text><text x="164" y="92" font-family="'Arial Black','Arial Bold',Gadget,Impact,'Helvetica Neue',Arial,sans-serif" font-size="44" font-weight="900" fill="#111111" letter-spacing="-1">ARCHITECTURE</text></g><rect x="64" y="158" width="250" height="106" fill="#111111" rx="6"/><rect x="56" y="150" width="250" height="106" fill="#FFFBF2" stroke="#111111" stroke-width="4" rx="6" id="operator"/><text x="181" y="186" font-family="'Arial Black','Arial Bold',Gadget,Impact,'Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="900" fill="#111111" text-anchor="middle" data-in="operator">OPERATOR</text><text x="181" y="214" font-family="'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif" font-size="15" font-weight="700" data-lines="b614b2afc" fill="#111111" text-anchor="middle" data-in="operator">fakeyou CLI</text><text x="181" y="236" font-family="'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif" font-size="15" font-weight="700" data-lines="b614b2afc" fill="#111111" text-anchor="middle" data-in="operator">or any HTTP client</text><rect x="932" y="158" width="236" height="106" fill="#111111" rx="6"/><rect x="924" y="150" width="236" height="106" fill="#EE2D27" stroke="#111111" stroke-width="4" rx="6" id="meet"/><text x="1042" y="186" font-family="'Arial Black','Arial Bold',Gadget,Impact,'Helvetica Neue',Arial,sans-serif" font-size="21" font-weight="900" fill="#FFFBF2" text-anchor="middle" data-in="meet">GOOGLE MEET</text><text x="1042" y="214" font-family="'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif" font-size="15" font-weight="700" data-lines="b9a9c956c" fill="#FFFBF2" text-anchor="middle" data-in="meet">the twin joins as</text><text x="1042" y="236" font-family="'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif" font-size="15" font-weight="700" data-lines="b9a9c956c" fill="#FFFBF2" text-anchor="middle" data-in="meet">a named guest</text><rect x="932" y="338" width="236" height="128" fill="#111111" rx="6"/><rect x="924" y="330" width="236" height="128" fill="#111111" stroke="#111111" stroke-width="4" rx="6" id="providers"/><text x="1042" y="366" font-family="'Arial Black','Arial Bold',Gadget,Impact,'Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="900" fill="#FFFBF2" text-anchor="middle" data-in="providers">PROVIDERS</text><text x="1042" y="394" font-family="'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif" font-size