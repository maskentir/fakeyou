,'DejaVu Sans Mono',monospace" font-size="15" font-weight="800" fill="#111111" text-anchor="middle">SHARED STORES · USED BY api AND WORKERS</text><rect x="84" y="820" width="140" height="116" fill="#111111" rx="6"/><rect x="76" y="812" width="140" height="116" fill="#E8DCC6" stroke="#111111" stroke-width="4" rx="6" id="s0"/><text x="146" y="848" font-family="'Arial Black','Arial Bold',Gadget,Impact,'Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="900" fill="#111111" text-anchor="middle" data-in="s0">PostgreSQL</text><text x="146" y="876" font-family="'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif" font-size="15" font-weight="700" data-lines="bbfe2d423" fill="#111111" text-anchor="middle" data-in="s0">sessions, jobs,</text><text x="146" y="898" font-family="'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif" font-size="15" font-weight="700" data-lines="bbfe2d423" fill="#111111" text-anchor="middle" data-in="s0">owner model</text><rect x="240" y="820" width="140" height="116" fill="#111111" rx="6"/><rect x="232" y="812" width="140" height="116" fill="#E8DCC6" stroke="#111111" stroke-width="4" rx="6" id="s1"/><text x="302" y="848" font-family="'Arial Black','Arial Bold',Gadget,Impact,'Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="900" fill="#111111" text-anchor="middle" data-in="s1">Neo4j</text><text x="302" y="876" font-family="'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif" font-size="15" font-weight="700" data-lines="ba5ecab24" fill="#111111" text-anchor="middle" data-in="s1">Graphiti</text><text x="302" y="898" font-family="'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif" font-size="15" font-weight="700" data-lines="ba5ecab24" fill="#111111" text-anchor="middle" data-in="s1">memory graph</text><rect x="396" y="820" width="140" height="116" fill="#111111" rx="6"/><rect x="388" y="812" width="140" height="116" fill="#E8DCC6" stroke="#111111" stroke-width="4" rx="6" id="s2"/><text x="