<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 672" width="1200" height="672" role="img" aria-labelledby="t d"><title id="t">Under the hood</title><desc id="d">Under the hood. LAYERS ARE LAW: import-linter fails the build when a package reaches up. NO GUESSED CONFIG: one strict settings schema; an unknown key is an error. REPLAYED MEETINGS: CI replays recorded meetings without secrets or network. QUOTES OR NOTHING: a claim whose quote is missing from its source is never served. CLAIM ≠ APPROVAL: meeting claims never change what the owner approved. LOCKED, NOT LOST: one record lock serializes forget, debrief and imports.</desc><style>
.in,.pop,.slide,.wob{transform-box:fill-box;transform-origin:center}
.in{animation:in .75s cubic-bezier(.2,1.45,.35,1) both}
@keyframes in{from{transform:translateY(-36px) rotate(-7deg)}}
.pop{animation:pop .6s cubic-bezier(.2,1.6,.4,1) both}
@keyframes pop{from{transform:scale(.82) rotate(-5deg)}}
.slide{animation:slide .7s cubic-bezier(.2,1.2,.4,1) both}
@keyframes slide{from{transform:translateX(-36px)}}
.wob{animation:wob 3.4s ease-in-out infinite alternate}
@keyframes wob{from{transform:rotate(-3deg)}to{transform:rotate(3deg)}}
.pulse{transform-box:fill-box;transform-origin:50% 100%;animation:pulse 1.3s ease-in-out infinite alternate}
@keyframes pulse{from{transform:scaleY(.45)}}
.marquee{animation:marquee 46s linear infinite}
@keyframes marquee{to{transform:translateX(var(--shift))}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><defs><pattern id="ink-dots" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(28)"><circle cx="4.5" cy="4.5" r="1.6" fill="#FFFBF2"/></pattern><pattern id="red-dots" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(18)"><circle cx="7" cy="7" r="2.4" fill="#111111" fill-opacity=".16"/></pattern><pattern id="cream-dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="4" cy="4" r="1.8" fill="#111111" fill-opacity=".08"/></pattern><marker id="head-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#111111"/></marker><marker id="head-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#FFFBF2"/></marker><marker id="head-lime" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D7F043"/></marker><clipPath id="frame"><rect width="1200" height="672" rx="26"/></clipPath></defs><g clip-path="url(#frame)"><rect x="0" y="0" width="1200" height="672" fill="#F6EEDF"/><rect x="0" y="0" width="1200" height="672" fill="url(#cream-dots)"/><g class="slide" style="animation-delay:0.00s"><rect x="56" y="44" width="86" height="62" fill="#111111" rx="4"/><text x="99" y="89" font-family="'Arial Black','Arial Bold',Gadget,Impact,'Helvetica Neue',Arial,sans-serif" font-size="38" font-weight="900" fill="#F6EEDF" text-anchor="middle">06</text><text x="164" y="92" font-family="'Arial Black','Arial Bold',Gadget,Impact,'Helvetica Neue',Arial,sans-serif" font-size="44" font-weight="900" fill="#111111" letter-spacing="-1">UNDER THE HOOD</text></g><g transform="translate(56 160) rotate(-1.2)"><g class="pop" style="animation-delay:0.15s"><path d="M0 0H340V204L323 213L306 204L289 213L272 204L255 213L238 204L221 213L204 204L187 213L170 204L153 213L136 204L119 213L102 204L85 21