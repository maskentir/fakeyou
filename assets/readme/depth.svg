 204Z" transform="translate(10 10)" fill="#111111"/><path id="receipt3" d="M0 0H340V204L323 213L306 204L289 213L272 204L255 213L238 204L221 213L204 204L187 213L170 204L153 213L136 204L119 213L102 204L85 213L68 204L51 213L34 204L17 213L0 204Z" fill="#111111" stroke="#111111" stroke-width="5" stroke-linejoin="round"/><text x="22" y="52" font-family="'Arial Black','Arial Bold',Gadget,Impact,'Helvetica Neue',Arial,sans-serif" font-size="23" font-weight="900" fill="#D7F043" data-in="receipt3">QUOTES OR NOTHING</text><line x1="22" y1="72" x2="318" y2="72" stroke="#FFFBF2" stroke-width="3" stroke-dasharray="4 7"/><text x="22" y="112" font-family="'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif" font-size="18" font-weight="700" data-lines="be8e72d40" fill="#FFFBF2" data-in="receipt3">a claim whose quote is missing</text><text x="22" y="142" font-family="'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif" font-size="18" font-weight="700" data-lines="be8e72d40" fill="#FFFBF2" data-in="receipt3">from its source is never served</text></g></g><g transform="translate(428 416) rotate(-0.9)"><g class="pop" style="animation-delay:0.55s"><path d="M0 0H340V204L323 213L306 204L289 213L272 204L255 213L238 204L221 213L204 204L187 213L170 204L153 213L136 204L119 213L102 204L85 213L68 204L51 213L34 204L17 213L0 204Z" transform="translate(10 10)" fill="#111111"/><path id="receipt4" d="M0 0H340V204L323 213L306 204L289 213L272 204L255 213L238 204L221 213L204 204L187 213L170 204L153 213L136 204L119 213L102 204L85 213L68 204L51 213L34 204L17 213L0 204Z" fill="#EE2D27" stroke="#111111" stroke-width="5" stroke-linejoin="round"/><text x="22" y="52" font-family="'Arial Black','Arial Bold',Gadget,Impact,'Helvetica Neue',Arial,sans-serif" font-size="23" font-weight="900" fill="#D7F043" data-in="receipt4">CLAIM ≠ APPROVAL</text><line x1="22" y1="72" x2="318" y2="72" stroke="#FFFBF2" stroke-width="3" stroke-dasharray="4 7"/><text x="22" y="112" font-family="'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif" font-size="18" font-weight="700" data-lines="ba09d2af3" fill="#FFFBF2" data-in="receipt4">meeting claims never change</text><text x="22" y="142" font-family="'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif" font-size="18" font-weight="700" data-lines="ba09d2af3" fill="#FFFBF2" data-in="receipt4">what the owner approved</text></g></g><g transform="translate(800 416) rotate(0.7)"><g class="pop" style="animation-delay:0.65s"><path d="M0 0H340V204L323 213L306 204L289 213L272 204L255 213L238 204L221 213L204 204L187 213L170 204L153 213L136 204L119 213L102 204L85 213L68 204L51 213L34 204L17 213L0 204Z" transform="translate(10 10)" fill="#111111"/><path id="receipt5" d="M0 0H340V204L323 213L306 204L289 213L272 204L255 213L238 204L221 213L204 204L187 213L170 204L153 213L136 204L119 213L102 204L85 213L68 204L51 213L34 204L17 213L0 204Z" fill="#FFFBF2" stroke="#111111" stroke-width="5" stroke-linejoin="round"/><text x="22" y="52" font-family="'Arial Black','Arial Bold',Gadget,Impact,'Helvetica Neue',Arial,sans-serif" font-size="23" font-weight="900" fill="#EE2D27" data-in="receipt5">LOCKED, NOT LOST</text><line x1="22" y1="72" x2="318" y2="72" stroke="#111111" stroke-width="3" stroke-dasharray="4 7"/><text x="22" y="112" font-family="'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif" font-size="18" font-weight="700" data-lines="ba91f7081" fill="#111111" data-in="receipt5">one record lock serializes</text><text x="22" y="142" font-family="'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif" font-size="18" font-weight="700" data-lines="ba91f7081" fill="#111111" data-in="receipt5">forget, debrief and imports</text></g></g></g></svg>
