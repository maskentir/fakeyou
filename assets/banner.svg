<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-labelledby="title desc">
  <title id="title">Fakeyou</title>
  <desc id="desc">Fakeyou, the self-hosted AI digital twin for engineering teams. It joins Google Meet, listens, remembers and speaks.</desc>
  <defs>
