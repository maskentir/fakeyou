<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-label="Fakeyou architecture">
  <title>Fakeyou architecture overview</title>
  <style>
    .d{font-family:'Arial Black', Impact, system-ui, sans-serif;font-weight:900}
    .m{font-family:'Courier New', monospace;font-weight:700}
    .label{font-family:Arial,Helvetica,sans-serif;font-weight:700}
    .dash{stroke-dasharray:8 8;animation:dash 10s linear infinite}
    .glow{animation:glow 2s ease-in-out infinite}
    @keyframes dash{to{stroke-dashoffset:-64}}
    @keyframes glow{50%{opacity:.45}}
    @media (prefers-reduced-motion: reduce){.dash,.glow{animation:none}}
  </style>
  <rect width="1200" height="520" fill="#f6eedf"/>
  <rect x="20" y="20" width="1160" height="480" fill="#fff8ee" stroke="#111" stroke-width="6"/>
  <text x="44" y="68" font-size="26" fill="#111" class="m">FAKEYOU / SYSTEM SHAPE</text>
  <text x="44" y="104" font-size="18" fill="#ee2d27" class="label">conversation → evidence → memory → response</text>

  <g transform="translate(54 148)">
    <rect x="0" y="0" width="214" height="104" rx="18" fill="#ee2d27" stroke="#111" stroke-width="5"/>
    <text x="24" y="44" font-size="28" fill="#f6eedf" class="d">MEETING</text>
    <text x="24" y="76" font-size="28" fill="#f6eedf" class="d">INPUTS</text>
    <text x="24" y="97" font-size="15" fill="#111" class="label">video / audio / chat / metadata</text>
  </g>

  <g transform="translate(318 106)">
    <rect x="0" y="0" width="252" height="188" rx="20" fill="#111" stroke="#111" stroke-width="5"/>
    <text x="26" y="42" font-size="30" fill="#d7f043" class="d">EVIDENCE</text>
    <text x="26" y="72" font-size="30" fill="#f6eedf" class="d">ENGINE</text>
    <rect x="26" y="94" width="198" height="28" rx="12" fill="#f6eedf"/>
    <text x="38" y="113" font-size="14" fill="#111" class="m">LISTENING / VISUAL / CONTEXT</text>
    <rect x="26" y="132" width="198" height="28" rx="12" fill="#f6eedf"/>
    <text x="38" y="151" font-size="14" fill="#111" class="m">CLASSIFICATION / SUFFICIENCY</text>
    <rect x="26" y="170" width="198" height="28" rx="12" fill="#f6eedf"/>
    <text x="38" y="189" font-size="14" fill="#111" class="m">REPORT CONTRACT / PROVENANCE</text>
  </g>

  <g transform="translate(624 92)">
    <rect x="0" y="0" width="238" height="216" rx="20" fill="#d7f043" stroke="#111" stroke-width="5"/>
    <text x="22" y="44" font-size="28" fill="#111" class="d">MEMORY</text>
    <text x="22" y="76" font-size="28" fill="#111" class="d">& DECISIONS</text>
    <text x="22" y="116" font-size="18" fill="#111" class="label">• meeting history</text>
    <text x="22" y="146" font-size="18" fill="#111" class="label">• decisions & outcomes</text>
    <text x="22" y="176" font-size="18" fill="#111" class="label">• evidence traces</text>
    <text x="22" y="206" font-size="18" fill="#111" class="label">• context for later answers</text>
  </g>

  <g transform="translate(910 148)">
    <rect x="0" y="0" width="226" height="104" rx="18" fill="#111" stroke="#111" stroke-width="5"/>
    <text x="24" y="42" font-size="26" fill="#d7f043" class="d">ASSISTANT</text>
    <text x="24" y="72" font-size="26" fill="#f6eedf" class="d">RESPONSE</text>
    <text x="24" y="93" font-size="15" fill="#f6eedf" class="label">answer / summary / next action</text>
  </g>

  <path d="M268 200H318" stroke="#111" stroke-width="8" stroke-linecap="round" class="dash" fill="none"/>
  <path d="M570 200H624" stroke="#111" stroke-width="8" stroke-linecap="round" class="dash" fill="none"/>
  <path d="M862 200H910" stroke="#111" stroke-width="8" stroke-linecap="round" class="dash" fill="none"/>
  <polygon points="309,200 289,188 289,212" fill="#111"/>
  <polygon points="615,200 595,188 595,212" fill="#111"/>
  <polygon points="901,200 881,188 881,212" fill="#111"/>

  <g transform="translate(298 342)">
    <rect x="0" y="0" width="564" height="108" rx="16" fill="#fff" stroke="#111" stroke-width="5"/>
    <text x="24" y="34" font-size="22" fill="#ee2d27" class="d">GUIDING IDEA</text>
    <text x="24" y="64" font-size="20" fill="#111" class="label">Turn conversation into durable engineering memory,</text>
    <text x="24" y="92" font-size="20" fill="#111" class="label">so AI becomes useful beyond the current meeting.</text>
    <circle cx="520" cy="54" r="24" fill="#d7f043" stroke="#111" stroke-width="5" class="glow"/>
    <text x="508" y="63" font-size="24" fill="#111" class="d">✳</text>
  </g>
</svg>
