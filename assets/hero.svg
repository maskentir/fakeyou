<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="FAKEYOU — THE AI DIGITAL TWIN FOR ENGINEERING TEAMS">
  <title>FAKEYOU — THE AI DIGITAL TWIN FOR ENGINEERING TEAMS</title>
  <style>
    .d{font-family:'Arial Black', Impact, system-ui, sans-serif;font-weight:900;letter-spacing:-2px}
    .m{font-family:'Courier New', monospace;font-weight:700}
    .slide{animation:slide 18s linear infinite}
    .blink{animation:blink 1.1s steps(1) infinite}
    .float{animation:float 2.8s ease-in-out infinite}
    .pulse{animation:pulse 2.1s ease-in-out infinite}
    @keyframes slide{to{transform:translateX(-420px)}}
    @keyframes blink{50%{opacity:0}}
    @keyframes float{50%{transform:translateY(-6px)}}
    @keyframes pulse{50%{transform:scale(1.03)}}
    @media (prefers-reduced-motion: reduce){.slide,.blink,.float,.pulse{animation:none}}
  </style>
  <defs>
    <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="2.2" fill="#111" opacity=".18"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="8" dy="8" stdDeviation="0" flood-color="#111" flood-opacity="1"/>
    </filter>
  </defs>
  <rect width="1200" height="420" fill="#ee2d27"/>
  <rect x="0" y="0" width="1200" height="420" fill="url(#dots)" opacity=".65"/>
  <rect x="0" y="0" width="1200" height="14" fill="#111"/>
  <rect x="0" y="406" width="1200" height="14" fill="#111"/>
  <path d="M 0 326 L 312 212 L 372 252 L 0 400 Z" fill="#f6eedf"/>
  <path d="M 885 0 L 1200 0 L 1200 178 L 1035 120 Z" fill="#111" opacity=".92"/>
  <path d="M 965 108 L 1200 30 L 1200 78 L 995 144 Z" fill="#d7f043"/>

  <g transform="translate(54 52)">
    <rect x="0" y="0" width="334" height="38" fill="#111"/>
    <text x="16" y="25" fill="#f6eedf" font-size="18" class="m">OPEN SOURCE / AI DIGITAL TWIN / SELF HOSTED</text>
  </g>

  <g transform="translate(58 108)">
    <text x="0" y="92" font-size="110" fill="#f6eedf" class="d" filter="url(#shadow)">FAKE</text>
    <text x="0" y="196" font-size="110" fill="#d7f043" class="d" filter="url(#shadow)">YOU</text>
    <text x="392" y="196" font-size="110" fill="#f6eedf" class="d" filter="url(#shadow)">.</text>
    <text x="10" y="250" font-size="34" fill="#111" class="d">THE AI DIGITAL TWIN FOR ENGINEERING TEAMS</text>
    <text x="8" y="292" font-size="22" fill="#f6eedf" style="font-family:Arial,Helvetica,sans-serif;font-weight:700">Joins meetings • Listens • Remembers • Speaks</text>
  </g>

  <g transform="translate(64 338)">
    <rect x="0" y="0" width="1060" height="44" rx="0" fill="#111"/>
    <g class="slide">
      <text x="20" y="29" font-size="19" fill="#f6eedf" class="m">BUILD MEMORY  ✳  GUARD DECISIONS  ✳  LISTEN TO MEETINGS  ✳  TURN CONVERSATION INTO EVIDENCE  ✳  BUILD MEMORY  ✳  GUARD DECISIONS  ✳  LISTEN TO MEETINGS  ✳  TURN CONVERSATION INTO EVIDENCE  ✳</text>
    </g>
  </g>

  <g transform="translate(785 78)">
    <g class="float">
      <rect x="0" y="34" width="290" height="224" rx="16" fill="#f6eedf" stroke="#111" stroke-width="6"/>
      <rect x="18" y="56" width="254" height="32" rx="12" fill="#111"/>
      <circle cx="36" cy="72" r="7" fill="#ee2d27"/>
      <circle cx="58" cy="72" r="7" fill="#d7f043"/>
      <circle cx="80" cy="72" r="7" fill="#f6eedf"/>
      <text x="100" y="79" font-size="16" fill="#f6eedf" class="m">MEETING.MEMORY</text>
      <g transform="translate(48 122)">
        <circle cx="50" cy="40" r="38" fill="#111"/>
        <circle cx="42" cy="34" r="7" fill="#d7f043"/>
        <circle cx="58" cy="34" r="7" fill="#d7f043"/>
        <rect x="36" y="48" width="28" height="8" rx="4" fill="#f6eedf"/>
        <text x="102" y="18" font-size="26" fill="#111" class="d">LISTEN</text>
        <text x="102" y="53" font-size="26" fill="#111" class="d">REMEMBER</text>
        <text x="102" y="88" font-size="26" fill="#111" class="d">SPEAK</text>
      </g>
      <g transform="translate(168 18) rotate(10)">
        <rect x="0" y="0" width="122" height="52" fill="#d7f043" stroke="#111" stroke-width="4"/>
        <text x="17" y="33" font-size="18" fill="#111" class="d">LIVE NOW</text>
      </g>
      <text x="214" y="229" font-size="22" fill="#111" class="d blink">REC ●</text>
    </g>
    <g transform="translate(214 -6) rotate(15)" class="pulse">
      <path d="M60 0l16 28 33-4-7 32 28 17-28 17 7 32-33-4-16 28-16-28-33 4 7-32L0 73l28-17-7-32 33 4z" fill="#d7f043" stroke="#111" stroke-width="6"/>
      <text x="60" y="57" font-size="24" text-anchor="middle" fill="#111" class="d">SHIP</text>
      <text x="60" y="86" font-size="24" text-anchor="middle" fill="#111" class="d">WITH</text>
      <text x="60" y="115" font-size="24" text-anchor="middle" fill="#111" class="d">MEMORY</text>
    </g>
  </g>
</svg>
