apiVersion: v1
kind: Namespace
metadata:
  name: fakeyou
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fakeyou-launcher
  namespace: fakeyou
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: fakeyou-session-jobs
  namespace: fakeyou
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "list", "get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: fakeyou-launcher-jobs
  namespace: fakeyou
subjects:
  - kind: ServiceAccount
    name: fakeyou-launcher
    namespace: fakeyou
roleRef:
  kind: Role
  name: fakeyou-session-jobs
  apiGroup: rbac.authorization.k8s.io
