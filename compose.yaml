name: fakeyou

services:
  meeting-worker:
    profiles: ["audio"]
    build:
      context: .
      dockerfile: docker/audio/Dockerfile
      target: runtime
    image: fakeyou-meeting-worker:local
    init: true
    shm_size: 1gb
    # Bypass the Docker Desktop embedded DNS forwarder; it stopped resolving
    # mid-call during live runs (EAI_NONAME killed STT reconnects and wedged TTS).
    dns:
      - 8.8.8.8
      - 1.1.1.1
    env_file: .env
    environment:
      EMBEDDING_DIM: ${FAKEYOU_MEMORY__EMBEDDER__DIM:-1024}
      FAKEYOU_BROWSER__HEADLESS: "false"
      # PULSE defaults follow src/fakeyou/audio.py as source of truth; override via env.
      PULSE_SOURCE: ${PULSE_SOURCE:-meeting_audio.monitor}
      PULSE_SINK: ${PULSE_SINK:-agent_output}
      FAKEYOU_MEMORY__STORE__URI: ${FAKEYOU_COMPOSE_WORKER_NEO4J_URI:-bolt://neo4j:7687}
      FAKEYOU_MEMORY__EMBEDDER__BASE_URL: ${FAKEYOU_COMPOSE_WORKER_EMBEDDING_BASE_URL:-${FAKEYOU_MEMORY__EMBEDDER__BASE_URL:-}}
    volumes:
      - ./.runtime/audio:/workspace/.runtime
      - ./examples:/workspace/examples:ro
    stop_grace_period: 45s

  neo4j:
    image: neo4j:5.26.31-community
    environment:
      NEO4J_AUTH: neo4j/${FAKEYOU_MEMORY__STORE__PASSWORD:?Set FAKEYOU_MEMORY__STORE__PASSWORD in .env before starting neo4j}
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$${NEO4J_AUTH#*/}\" 'RETURN 1' >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  embeddings:
    image: ${FAKEYOU_COMPOSE_EMBEDDINGS_IMAGE:-ghcr.io/huggingface/text-embeddings-inference:cpu-arm64-1.9}
    profiles: ["embeddings"]
    command:
      - --model-id
      - ${FAKEYOU_COMPOSE_EMBEDDINGS_MODEL_ID:-ibm-granite/granite-embedding-97m-multilingual-r2}
      - --revision
      - ${FAKEYOU_COMPOSE_EMBEDDINGS_REVISION:-835ad14087e140460703cf0fae09f97d469d65c2}
      - --max-batch-tokens
      - "2048"
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - tei_models:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 30s

  postgres:
    image: postgres:17.11-alpine
    profiles: ["production"]
    environment:
      POSTGRES_DB: fakeyou
      POSTGRES_USER: fakeyou
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fakeyou-local-only}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fakeyou -d fakeyou"]
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  neo4j_data:
  postgres_data:
  tei_models:
