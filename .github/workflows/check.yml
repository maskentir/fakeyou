name: Foundation checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DEEPEVAL_TELEMETRY_OPT_OUT: "YES"
      LANGSMITH_TRACING: "false"
      GRAPHITI_TELEMETRY_ENABLED: "false"
      TEST_DATABASE_URL: postgresql://fakeyou:ci-only@localhost:5432/fakeyou
    services:
      postgres:
        image: postgres:17.11-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_DB: fakeyou
          POSTGRES_USER: fakeyou
          POSTGRES_PASSWORD: ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fakeyou -d fakeyou"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.11.7"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked --all-groups
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync mypy
      - run: uv run --no-sync lint-imports
      - run: uv run --no-sync deptry .
      - run: uv run --no-sync pytest
      - run: uv build
      - name: Provide a harness env file for Compose
        run: cp .env.example .env
      - name: Validate Compose configuration
        run: docker compose config --quiet
        env:
          FAKEYOU_MEMORY__STORE__PASSWORD: ci-config-check-only
          POSTGRES_PASSWORD: ci-config-check-only
      - name: Audit locked Python dependencies
        run: |
          uv export --frozen --no-hashes --all-groups --all-extras --no-emit-project --no-annotate --no-header > "$RUNNER_TEMP/requirements-audit.txt"
          uvx pip-audit==2.10.1 --no-deps --strict --progress-spinner off -r "$RUNNER_TEMP/requirements-audit.txt"

  node:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
      - name: Install from lockfile without install scripts
        run: npm ci --ignore-scripts
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks 8.30.1 with checksum
        env:
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -fsSL -o "$RUNNER_TEMP/gitleaks.tar.gz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan git history for secrets
        run: |
          "$RUNNER_TEMP/gitleaks" git --log-opts="--all" --config .gitleaks.toml --redact --no-banner --exit-code 1
