name: Meeting simulator

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the audio test image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/audio/Dockerfile
          target: test
          tags: fakeyou-test:local
          load: true
          cache-from: type=gha,scope=audio-test
          cache-to: type=gha,scope=audio-test,mode=max
      - name: Replay every simulator scenario from its cassette, with every provider host refused
        run: |
          mkdir -p "$RUNNER_TEMP/simulator"
          chmod 777 "$RUNNER_TEMP/simulator"
          docker run --rm \
            --add-host generativelanguage.googleapis.com:127.0.0.1 \
            --add-host api.cartesia.ai:127.0.0.1 \
            --add-host api.meta.ai:127.0.0.1 \
            --add-host api.openai.com:127.0.0.1 \
            --add-host api.anthropic.com:127.0.0.1 \
            --add-host api.elevenlabs.io:127.0.0.1 \
            --add-host api.minimax.io:127.0.0.1 \
            -e SIMULATOR_PROVIDERS=replay \
            -e SIMULATOR_ARTIFACT_DIR=/artifacts \
            -e SIMULATOR_REVISION="$GITHUB_SHA" \
            -v "$RUNNER_TEMP/simulator:/artifacts" \
            -v "$PWD/tests:/workspace/tests:ro" \
            -v "$PWD/evals:/workspace/evals:ro" \
            -v "$PWD/src:/workspace/src:ro" \
            -v "$PWD/conftest.py:/workspace/conftest.py:ro" \
            -v "$PWD/pyproject.toml:/workspace/pyproject.toml:ro" \
            fakeyou-test:local uv run --no-sync pytest -m simulator evals/test_meeting_simulator_eval.py -q -p no:cacheprovider
      - name: Show each scenario report when a scenario fails
        if: failure()
        run: |
          for report in "$RUNNER_TEMP"/simulator/reports/*.json; do
            echo "::group::$report"
            cat "$report"
            echo "::endgroup::"
          done
